# GitHub Actions: Data Collection + Preprocessing (Combined)
# Mengumpulkan data ping + langsung preprocess
# Repo: Eksperimen_SML_glenferdinza_15

name: Data Collection & Preprocessing

on:
  schedule:
    - cron: '*/15 * * * *'   # Setiap 15 menit
  workflow_dispatch:          # Manual trigger

permissions:
  contents: write

jobs:
  collect-and-preprocess:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn

      - name: Collect ping data
        run: python data_collector.py

      - name: Run preprocessing
        run: |
          python automate_glenferdinza_15.py latency_raw.csv preprocessing/latency_preprocessing.csv

      - name: Show results
        run: |
          echo "=== Raw data rows ==="
          wc -l latency_raw.csv
          echo "=== Preprocessed data rows ==="
          wc -l preprocessing/latency_preprocessing.csv

      - name: Commit and push
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add latency_raw.csv preprocessing/latency_preprocessing.csv
          git diff --staged --quiet || git commit -m "Auto: data collection + preprocessing $(date +'%Y-%m-%d %H:%M') [skip ci]"
          git push
